name: Daily Market Intelligence

on:
  schedule:
    - cron: '0 6 * * *'  # 6:00 AM UTC+3 (daily)
  workflow_dispatch:

jobs:
  market_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run market intelligence agent
        run: |
          python3 agents/market-intelligence-daily-agent.py
      
      - name: Commit results
        run: |
          git config user.email "j@wiggleez.ai"
          git config user.name "J"
          git add data/
          git commit -m "Market intel update - $(date)" || true
          git push
